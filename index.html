<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peut-on souhaiter la bonne année aujourd'hui ?</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: clamp(1.5rem, 4vw, 3rem);
      background: #000;
      color: #fff;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }

    body.yes {
      background: #86ff65;
      color: #0a0a0a;
    }

    main {
      width: min(90vw, 760px);
      display: grid;
      gap: clamp(1.25rem, 3vw, 2.5rem);
      text-align: center;
      padding: clamp(2.5rem, 5vw, 4rem) clamp(1.75rem, 4vw, 3rem);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.7rem);
      font-weight: 800;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      line-height: 1.15;
    }

    .gif-frame {
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 3px solid #fff;
      background: #111;
    }

    body.yes .gif-frame {
      border-color: #000;
      background: #fffde2;
    }

    .gif-frame img {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      display: block;
      background: #000;
    }

    body.yes .gif-frame img {
      background: #fffde2;
    }

    .answer {
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    body.yes .answer {
      color: #0b45cd;
    }
  </style>
</head>
<body>
  <main>
    <h1>Peut-on souhaiter la bonne année aujourd&#39;hui ?</h1>
    <div class="gif-frame">
      <img data-gif alt="" loading="lazy">
    </div>
    <div class="answer" data-answer></div>
  </main>

  <script>
    async function fetchRandomGif(tag) {
      const endpoint = `https://api.giphy.com/v1/gifs/random?api_key=0ii51X76Q2wMwn180o9IeM5FovDqDgAs&tag=${encodeURIComponent(tag)}&rating=g`;
      const res = await fetch(endpoint);
      if (!res.ok) throw new Error("Gif fetch failed");
      const data = await res.json();
      return data?.data?.images?.downsized_large?.url || data?.data?.images?.downsized?.url;
    }

    (async () => {
      const today = new Date();
      const isJanuary = today.getMonth() === 0;
      const answerText = isJanuary ? "Oui" : "Non";
      const query = isJanuary ? "yes" : "no";

      document.querySelector("[data-answer]").textContent = answerText;
      document.body.classList.toggle("yes", isJanuary);

      const gifEl = document.querySelector("[data-gif]");
      try {
        const url = await fetchRandomGif(query);
        if (url) {
          gifEl.src = url;
          gifEl.alt = `Gif pour ${answerText.toLowerCase()}.`;
          return;
        }
      } catch (err) {
        console.error(err);
      }
      // Fallback if the API fails.
      gifEl.src = isJanuary
        ? "https://media.giphy.com/media/111ebonMs90YLu/giphy.gif"
        : "https://media3.giphy.com/media/v1.Y2lkPTE4NDZkMDI3dmRheWs1dGE2Nzg1anV2eHMwc2w2MzBkbGlvemk4eTN2eHZvOTIwaSZlcD12MV9naWZzX3JhbmRvbSZjdD1n/l0K3Y1kfhjrfNZuco/giphy.gif";
      gifEl.alt = "Gif non disponible, utilisation du secours.";
    })();
  </script>
</body>
</html>
