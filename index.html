<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peut-on souhaiter la bonne année aujourd'hui ?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0d11;
      --text: #f5f5f0;
      --muted: #8f93a3;
      --border: rgba(255, 255, 255, 0.08);
      --glow: rgba(124, 247, 199, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 4vw, 3rem);
      background: radial-gradient(circle at 25% 20%, rgba(124, 247, 199, 0.08), transparent 35%), radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.06), transparent 40%), var(--bg);
      color: var(--text);
      font-family: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    }

    main {
      width: min(90vw, 760px);
      display: grid;
      gap: clamp(1.25rem, 3vw, 2.5rem);
      text-align: center;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: clamp(1.75rem, 4vw, 3rem);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.7rem);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .gif-frame {
      display: grid;
      place-items: center;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.02), 0 0 35px var(--glow);
    }

    .gif-frame img {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      display: block;
      background: #0b0c10;
    }

    .answer {
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <h1>Peut-on souhaiter la bonne année aujourd&#39;hui ?</h1>
    <div class="gif-frame">
      <img data-gif alt="" loading="lazy">
    </div>
    <div class="answer" data-answer></div>
  </main>

  <script>
    async function fetchRandomGif(tag) {
      const endpoint = `https://api.giphy.com/v1/gifs/random?api_key=0ii51X76Q2wMwn180o9IeM5FovDqDgAs&tag=${encodeURIComponent(tag)}&rating=g`;
      const res = await fetch(endpoint);
      if (!res.ok) throw new Error("Gif fetch failed");
      const data = await res.json();
      return data?.data?.images?.downsized_large?.url || data?.data?.images?.downsized?.url;
    }

    (async () => {
      const today = new Date();
      const isJanuary = today.getMonth() === 0;
      const answerText = isJanuary ? "Oui" : "Non";
      const query = isJanuary ? "yes" : "no";

      document.querySelector("[data-answer]").textContent = answerText;

      const gifEl = document.querySelector("[data-gif]");
      try {
        const url = await fetchRandomGif(query);
        if (url) {
          gifEl.src = url;
          gifEl.alt = `Gif pour ${answerText.toLowerCase()}.`;
          return;
        }
      } catch (err) {
        console.error(err);
      }
      // Fallback if the API fails.
      gifEl.src = isJanuary
        ? "https://media.giphy.com/media/111ebonMs90YLu/giphy.gif"
        : "https://media3.giphy.com/media/v1.Y2lkPTE4NDZkMDI3dmRheWs1dGE2Nzg1anV2eHMwc2w2MzBkbGlvemk4eTN2eHZvOTIwaSZlcD12MV9naWZzX3JhbmRvbSZjdD1n/l0K3Y1kfhjrfNZuco/giphy.gif";
      gifEl.alt = "Gif non disponible, utilisation du secours.";
    })();
  </script>
</body>
</html>
